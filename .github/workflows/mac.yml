# Builds the Mac .dmg (unsigned, universal) and attaches it to each GitHub release that release.cjs publishes.
name: mac
on:
  release:
    types: [published]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run dist:mac
      - if: github.event_name == 'release'
        run: gh release upload "${{ github.event.release.tag_name }}" release/*.dmg --clobber
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: release/*.dmg
